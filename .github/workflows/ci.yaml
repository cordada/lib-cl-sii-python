# GitHub Actions Workflow for Continuous Integration

name: CI

on:
  workflow_call:

permissions:
  contents: read

env:
  PYTHON_VIRTUALENV_ACTIVATE: venv/bin/activate

jobs:
  pre-build:
    name: Pre-Build
    runs-on: ubuntu-22.04

    steps:
      - run: "true"

  build:
    name: Build
    needs:
      - pre-build
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        python_version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check Out VCS Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Python ${{ matrix.python_version }}
        id: set_up_python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ matrix.python_version }}"
          check-latest: true

      - name: Install Pip
        run: make python-pip-install

      - name: Restoring/Saving Cache
        id: restoring_saving_cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tox
            venv
          key: py-v1-deps-${{ runner.os }}-${{ steps.set_up_python.outputs.python-version }}-${{ hashFiles('pyproject.toml', 'requirements.txt', 'requirements-dev.txt', 'Makefile', 'make/**.mk') }}

      - name: Create Python Virtual Environment
        # Only when the cache was not restored. The cache is restored by extracting an archive
        # over the workspace, so restoring it over an existing virtual environment merges the Pip
        # installation that `python -m venv` bootstraps with the cached one, instead of replacing
        # it. That leaves an unusable Pip whenever the two versions lay out their internal modules
        # differently.
        if: ${{ steps.restoring_saving_cache.outputs.cache-hit != 'true' }}
        run: make python-virtualenv PYTHON_VIRTUALENV_DIR="venv"

      - name: Install Dependencies
        run: |
          source "$PYTHON_VIRTUALENV_ACTIVATE"
          make install-deps-dev

      - name: Install Library
        run: |
          source "$PYTHON_VIRTUALENV_ACTIVATE"
          make install-dev

  test:
    name: Test
    needs:
      - test-
    runs-on: ubuntu-22.04

    steps:
      - name: Do Nothing
        run: |
          echo "This job is only to have a common 'needs' for future jobs after 'test'."

  test-:
    name: Test
    needs:
      - build
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        python_version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check Out VCS Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set Up Python ${{ matrix.python_version }}
        id: set_up_python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "${{ matrix.python_version }}"
          check-latest: true

      - name: Restoring/Saving Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .tox
            venv
          key: py-v1-deps-${{ runner.os }}-${{ steps.set_up_python.outputs.python-version }}-${{ hashFiles('pyproject.toml', 'requirements.txt', 'requirements-dev.txt', 'Makefile', 'make/**.mk') }}
          fail-on-cache-miss: true

      - name: Set Tox Environment
        id: set_tox_environment
        run: |
          # Set Tox environment to the installed Python version.
          tox_env=$(
            python -c 'import sys; v = sys.version_info; print("py{}{}".format(v.major, v.minor))'
          )

          echo "tox_env=${tox_env:?}" >> "$GITHUB_OUTPUT"

      - name: Test
        run: |
          source "$PYTHON_VIRTUALENV_ACTIVATE"
          make test
        env:
          TOXENV: ${{ steps.set_tox_environment.outputs.tox_env }}

      - name: Lint
        run: |
          source "$PYTHON_VIRTUALENV_ACTIVATE"
          make lint

      - name: Test Coverage
        run: |
          source "$PYTHON_VIRTUALENV_ACTIVATE"
          make test-coverage

      - name: Test Coverage Report
        run: |
          source "$PYTHON_VIRTUALENV_ACTIVATE"
          make test-coverage-report

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          directory: ./test-reports/coverage/
          fail_ci_if_error: true

      - name: Check that compiled Python dependency manifests are up-to-date with their sources
        # FIXME: There are issues related to testing with multiple Python versions.
        if: ${{ startsWith(steps.set_up_python.outputs.python-version, '3.10.') }}
        run: |
          source "$PYTHON_VIRTUALENV_ACTIVATE"
          make python-deps-sync-check

      - name: Store Artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test_reports_${{ matrix.python_version }}
          path: test-reports/
          if-no-files-found: warn
